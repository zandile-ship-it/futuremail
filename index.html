<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future Mail</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="envelope" id="card">
    <div class="stamp" aria-hidden="true">📫</div>
    <h1>Write to future you</h1>
    <p class="sub">Say hi, then pick the day and time to open it.</p>

    <div class="field">
      <label for="name">Your name</label>
      <input id="name" type="text" autocomplete="given-name" placeholder="Zandile">
    </div>

    <div class="row">
      <div class="field">
        <label for="date">Arrive on</label>
        <input id="date" type="date">
      </div>
      <div class="field">
        <label for="time">At what time</label>
        <input id="time" type="time" value="09:00">
      </div>
    </div>

    <div class="field">
      <label for="email">Send it to your email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
    </div>
    <input id="website" class="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="field">
      <label for="message">Your letter</label>
      <textarea id="message" maxlength="3000" placeholder="Dear future me…"></textarea>
      <div class="count"><span id="chars">0</span> / 3000</div>
    </div>

    <div class="actions">
      <button class="primary" id="sendBtn" type="button">Send to my inbox</button>
      <button class="secondary" id="calBtn" type="button">Remind me on the day</button>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="script.js"></script>
</body>
</html>
